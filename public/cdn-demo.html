<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QrVerse CDN Scanner — Demo</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0b1020; color: #e8ecf7; margin: 0; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; padding: 40px 16px;
    }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p.sub { color: #8b95b3; margin: 0 0 28px; font-size: .95rem; text-align: center; }
    .card {
      background: #151b30; border: 1px solid #262f4d; border-radius: 14px;
      padding: 24px; width: 100%; max-width: 460px; box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }
    label { display: block; font-weight: 600; margin: 0 0 8px; color: #aeb7d6; }
    input[type="file"] { width: 100%; padding: 10px; border-radius: 8px;
      background: #0e1327; border: 1px dashed #3a4170; color: #c9d1ef; }
    button {
      margin-top: 14px; width: 100%; padding: 12px; border: 0; border-radius: 9px;
      background: linear-gradient(135deg, #6d5cff, #4f9cff); color: #fff;
      font-weight: 700; font-size: 1rem; cursor: pointer; transition: filter .15s;
    }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #result {
      margin-top: 18px; padding: 14px; border-radius: 10px; background: #0e1327;
      border-left: 4px solid #2fbd6f; white-space: pre-wrap; word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9rem;
    }
    #result.error { border-left-color: #ff5b5b; color: #ff9c9c; }
    .code { background: #0e1327; border: 1px solid #262b4d; border-radius: 8px; padding: 10px 12px;
      font-size: .78rem; overflow-x: auto; margin-top: 26px; max-width: 460px; width: 100%;
      word-break: break-all; }
    .code b { color: #8fb4ff; }
  </style>
</head>
<body>
  <h1>QrVerse CDN Scanner</h1>
  <p class="sub">Upload an image containing a QR code and scan it locally in your browser.</p>

  <div class="card">
    <label for="file">Choose an image with a QR code</label>
    <input type="file" id="file" accept="image/*">
    <button id="scan">Scan QR code</button>
    <div id="result"></div>
  </div>

  <div class="code">
    Loaded this page with:
    <b>&lt;script src="../cdn/qrverse.min.js"&gt;&lt;/script&gt;</b><br>
    Result via:
    <b>QrVerse.scan(fileInput).then(r =&gt; r.data)</b>
  </div>

  <script src="../cdn/qrverse.min.js"></script>
  <script>
    const fileInput = document.getElementById('file');
    const scanBtn = document.getElementById('scan');
    const result = document.getElementById('result');

    scanBtn.addEventListener('click', async () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) { show('Please choose an image first.', true); return; }

      result.textContent = 'Scanning…';
      scanBtn.disabled = true;
      try {
        const res = await QrVerse.scan(file);
        show('Scanned data: "' + res.data + '"');
      } catch (err) {
        show('Could not scan: ' + (err.message || err), true);
      } finally {
        scanBtn.disabled = false;
      }
    });

    function show(msg, isError) {
      result.textContent = msg;
      result.className = isError ? 'error' : '';
    }
  </script>
</body>
</html>
