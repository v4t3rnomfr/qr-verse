<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QrVerse CDN — Test</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b1020; color: #e8ecf7; padding: 40px 16px; }
    .card { max-width: 520px; margin: 0 auto 24px; background: #151b30; border: 1px solid #262f4d; border-radius: 14px; padding: 24px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; color: #aeb7d6; }
    input[type=file] { width: 100%; }
    button { margin-top: 8px; padding: 8px 14px; border: 0; border-radius: 8px; background: linear-gradient(135deg,#6d5cff,#4f9cff); color: #fff; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; }
    pre { background: #0e1327; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; font-size: .85rem; }
    .code { font-family: ui-monospace, monospace; color: #8fb4ff; }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin:0 0 6px">CDN loader check</h2>
    <pre id="api">loading…</pre>
  </div>

  <div class="card">
    <label for="file">Upload an image containing a QR code</label>
    <input type="file" id="file" accept="image/*">
    <button id="scan">QrVerse.scan(file)</button>
    <pre id="result">—</pre>
  </div>

  <div class="card">
    <label for="dataUrl">Scan by URL / data URL</label>
    <input id="dataUrl" type="text" placeholder="data:image/png;base64,...." style="width:100%;padding:8px;box-sizing:border-box">
    <button id="scanUrl" style="margin-top:8px">QrVerse.scanUrl(value)</button>
    <pre id="scanUrlResult">—</pre>
  </div>

  <div class="card">
    <label for="genText">Generate a QR code</label>
    <input id="genText" type="text" value="https://qrverse.dev" style="width:100%;padding:8px;box-sizing:border-box">
    <label for="genColor" style="margin-top:10px">Foreground color</label>
    <input id="genColor" type="color" value="#6366f1" style="width:56px;height:34px;padding:2px;border:1px solid #262f4d;border-radius:8px;background:#0e1327">
    <label for="genDots" style="margin-top:10px">Dot style</label>
    <select id="genDots" style="width:100%;padding:8px;background:#0e1327;color:#e8ecf7;border:1px solid #262f4d;border-radius:8px">
      <option value="square">Square</option>
      <option value="rounded">Rounded</option>
      <option value="circle">Circle</option>
    </select>
    <button id="gen" style="margin-top:8px">QrVerse.generate(text)</button>
    <img id="genPreview" alt="Generated QR" style="display:block;width:220px;height:220px;margin-top:12px;background:#fff;border-radius:8px;padding:6px">
    <pre id="genResult">—</pre>
    <button id="genScan" style="margin-top:8px" disabled>Scan it back (round-trip)</button>
  </div>


  <script src="https://cdn.jsdelivr.net/gh/v4t3rnomfr/qr-verse@master/cdn/qrverse.min.js"></script>
  <script>
    (function () {
      var api = document.getElementById('api');
      var cheats = {
        hasQrVerse: typeof QrVerse !== 'undefined',
        hasDecoder: typeof QrVerse !== 'undefined' && typeof QrVerseDecoder === 'function',
        hasStyling: typeof QrVerse !== 'undefined' && typeof QrVerseStyling === 'function',
        hasGenerate: typeof QrVerse !== 'undefined' && typeof QrVerse.generate === 'function',
        version: typeof QrVerse !== 'undefined' ? QrVerse.version : null,
      };
      api.textContent = JSON.stringify(cheats, null, 2);
      if (!cheats.hasQrVerse) {
        api.textContent += '\n\nERROR: script failed to load or expose QrVerse.';
      }
    })();

    document.getElementById('scan').addEventListener('click', async function () {
      var file = document.getElementById('file').files && document.getElementById('file').files[0];
      var out = document.getElementById('result');
      if (!file) { output('result', 'No file selected.', true); return; }
      output('result', 'Scanning…');
      try {
        var res = await QrVerse.scan(file);
        output('result', 'OK data: "' + res.data + '"');
      } catch (e) {
        output('result', 'ERR: ' + (e && e.message) + ' (code=' + (e && e.code) + ')', true);
      }
    });

    document.getElementById('scanUrl').addEventListener('click', async function () {
      var v = document.getElementById('dataUrl').value.trim();
      if (!v) { output('scanUrlResult', 'Paste a data URL first.', true); return; }
      output('scanUrlResult', 'Scanning…');
      try {
        var res = await QrVerse.scanUrl(v);
        output('scanUrlResult', 'OK data: "' + res.data + '"');
      } catch (e) {
        output('scanUrlResult', 'ERR: ' + (e && e.message) + ' (code=' + (e && e.code) + ')', true);
      }
    });

    var generatedDataUrl = null;
    document.getElementById('gen').addEventListener('click', async function () {
      var text = document.getElementById('genText').value.trim();
      if (!text) { output('genResult', 'Enter some text first.', true); return; }
      output('genResult', 'Generating…');
      document.getElementById('genScan').disabled = true;
      try {
        var res = await QrVerse.generate(text, {
          width: 300,
          color: document.getElementById('genColor').value,
          dots: document.getElementById('genDots').value,
          errorCorrectionLevel: 'H'
        });
        generatedDataUrl = res.data;
        document.getElementById('genPreview').src = generatedDataUrl;
        document.getElementById('genScan').disabled = false;
        output('genResult', 'OK ' + res.type + ' ' + res.width + 'x' + res.width);
      } catch (e) {
        output('genResult', 'ERR: ' + (e && e.message) + ' (code=' + (e && e.code) + ')', true);
      }
    });

    document.getElementById('genScan').addEventListener('click', async function () {
      if (!generatedDataUrl) return;
      output('genResult', 'Scanning back…');
      try {
        var res = await QrVerse.scanUrl(generatedDataUrl);
        output('genResult', 'ROUND-TRIP OK: "' + res.data + '"');
      } catch (e) {
        output('genResult', 'Round-trip ERR: ' + (e && e.message) + ' (code=' + (e && e.code) + ')', true);
      }
    });

    function output(id, msg, isError) {
      var el = document.getElementById(id);
      el.textContent = msg;
      el.style.color = isError ? '#ff9c9c' : '';
    }
  </script>
</body>
</html>
